{% extends "base.html" %}
{% load static %}
{% load tailwind_filters %}
{% load crispy_forms_tags %}

{% block title %}Availability{% endblock title %}

{% block content %}
<section class="relative min-h-dvh w-full">
    <div
        class="flex flex-col min-h-dvh items-center justify-center w-full bg-[url('/static/png/room_photo.png')] bg-cover bg-no-repeat bg-center">

        <!-- calendar -->
        <div class="flex flex-col z-10 bg-white text-xl w-2/4 font-normal capitalize text-black text-center p-10">
            <form hx-get="{% url 'rooms:room_availability' %}" hx-target="#result" hx-indicator="" hx-swap="outerHTML">
                {{ availability_form|crispy }}
                <button type="submit"
                    class="btn-lg text-2xl px-10 py-4 rounded-2xl text-white font-normal bg-charcoal capitalize">check</button>
            </form>
        </div>
        {% include 'partials/availability_result.html' %}
    </div>
</section>
{% endblock content %}
